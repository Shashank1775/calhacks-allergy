# The one Python project in this repo: package `kitchen`, managed by uv (AGENTS.md, Engineering conventions).
# Owner: team platform. Add dependencies in your own PR and re-run `uv lock`; never hand-merge uv.lock.

[project]
name = "kitchen"
version = "0.1.0"
description = "Kitchen allergen tracker: camera tracking, a provenance graph and fail-closed plate verdicts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Each extra starts empty. A team adds what its step needs, then runs `uv lock`.
pi = []      # on the Raspberry Pi: camera, GPIO, Hailo runtime (vision, gate)
ml = []      # models: PyTorch, ONNX Runtime (vision, sim, the partner's LSTM)
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]  # HTTP servers: the Orders API and the Pi server (orders, vision)

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# kitchen/ sits at the repo root rather than under src/.
module-name = "kitchen"
module-root = ""

[tool.ruff]
line-length = 120
# Python files only. Ruff also formats code blocks inside Markdown, which would rewrite contracts/apis.md.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus whitespace, import order, snake_case naming, likely bugs and modern syntax.
# Line length is the formatter's job, so E501 stays off: the formatter never splits long docstring lines.
select = ["E4", "E7", "E9", "F", "W", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["kitchen", "tests"]
# importlib lets every kitchen/<step>/tests/ folder reuse test file names without __init__.py files.
# --strict-markers makes a misspelled marker an error, so a `safety` test can't silently lose its marker.
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "safety: guards one of the nine safety rules (AGENTS.md, Safety rules)",
    "hardware: needs a real device; CI deselects it",
    "slow: runs nightly; CI deselects it on pull requests",
    "contract: a contract suite that every implementation, fake or real, must pass",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.170.9",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
