name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --locked fails if someone changed pyproject.toml without re-running `uv lock`.
      - name: Install
        run: uv sync --locked --all-extras
      # Agents never edit the partner's folders (AGENTS.md, Partner-owned areas); only partner/* branches may.
      - name: Partner folders untouched
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'partner/')
        run: |
          touched=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- kitchen/entities kitchen/interactions kitchen/lstm kitchen/graph database)
          if [ -n "$touched" ]; then
            echo "Only partner/* branches may change these files:"
            echo "$touched"
            exit 1
          fi
      - name: Contracts
        run: uv run python tools/validate_contracts.py
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # hardware needs a real device; slow is for local runs.
      - name: Tests
        run: uv run pytest -m 'not hardware and not slow'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # web/.nvmrc is the one place the Node version lives (web framework decision: Node 24, engines >= 24.15).
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      # tsc --noEmit, then the Vite build.
      - name: Type check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx prettier --check src
