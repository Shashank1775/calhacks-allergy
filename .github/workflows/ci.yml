name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Required by the protect-main ruleset (tools/bootstrap_github.sh). Keep this job name stable.
  contracts-and-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate contracts, fixtures and golden scenarios
        run: python tools/validate_contracts.py
      - name: Every file has an owner
        run: python tools/check_ownership.py
      - name: Owners touched by this PR
        if: github.event_name == 'pull_request'
        run: python tools/check_ownership.py --diff origin/${{ github.base_ref }} --branch ${{ github.head_ref }}
      - name: Phase gate
        if: github.event_name == 'pull_request'
        run: python tools/check_phase_gate.py --diff origin/${{ github.base_ref }}
      - name: Backlog is valid
        run: python tools/seed_issues.py --dry-run > /dev/null

  # ruff over every Python file in the repo (rules in pyproject.toml).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --locked fails the job if someone changed pyproject.toml without re-running `uv lock`.
      - name: Install the dev tools
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .

  # Every folder's tests, minus `hardware` (needs a real device) and `slow` (nightly).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # Every extra, so each folder's tests find the libraries its step needs.
      - name: Install the kitchen package
        run: uv sync --locked --all-extras
      - name: Tests
        run: uv run pytest -m 'not hardware and not slow'
