name: RFC (contract or architecture change)
description: Propose a change to contracts/ or to an architecture decision
labels: ["type:rfc", "contract-change", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: Add a `team:` label for every affected team. Each affected Manager comments ACK / ACK with changes / NACK. See docs/agents/WORKFLOW.md#contract-changes-rfcs.
  - type: textarea
    id: change
    attributes: { label: Proposed change, description: Exact fields, types, endpoints or table columns. }
    validations: { required: true }
  - type: textarea
    id: motivation
    attributes: { label: Motivation }
    validations: { required: true }
  - type: textarea
    id: parties
    attributes: { label: Producers and consumers affected }
    validations: { required: true }
  - type: dropdown
    id: breaking
    attributes:
      label: Compatibility
      options: ["Additive (minor version bump)", "Breaking (major version bump)"]
    validations: { required: true }
  - type: textarea
    id: migration
    attributes: { label: Migration plan, description: Required if breaking. }
  - type: textarea
    id: safety
    attributes: { label: Safety impact, description: Does this touch any of the nine invariants in docs/ARCHITECTURE.md? }
    validations: { required: true }
  - type: textarea
    id: signature
    attributes: { label: Proposed by, placeholder: "— [manager/<team>]" }
    validations: { required: true }
