name: Question for the Director or owner
description: A decision only the Director or the owner can make
labels: ["type:question", "status:needs-human"]
body:
  - type: textarea
    id: question
    attributes: { label: Question }
    validations: { required: true }
  - type: textarea
    id: options
    attributes: { label: Options, description: Each option with its consequences. }
    validations: { required: true }
  - type: textarea
    id: recommendation
    attributes: { label: Recommendation, description: Which option, and why. }
    validations: { required: true }
  - type: textarea
    id: blocked
    attributes: { label: What is blocked until this is answered }
  - type: textarea
    id: signature
    attributes: { label: Asked by, placeholder: "— [manager/<team>]" }
    validations: { required: true }
